server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; lets nginx start before the backend is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # API -> FastAPI. The client IP is set here (not taken from the browser).
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Built assets (hashed file names).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # The SPA shell is only reachable through the backend check below.
    location /_spa/ {
        internal;
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-store";
    }

    # Every page load asks the backend first. Normally it answers with
    # X-Accel-Redirect (-> index.html); in outage mode it answers 503 with the
    # maintenance page, so page loads get a real HTTP 503 too.
    location / {
        rewrite ^ /api/_shell break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
