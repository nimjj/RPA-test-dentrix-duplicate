# LedgerLab: mock dental practice-management app for RPA testing.
# `docker compose up --build` starts the frontend, the backend and Mailpit.
# Values come from .env (copy .env.example); every one has a default.
name: ledgerlab

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/ledgerlab.db
      SEED_PASSWORD: ${SEED_PASSWORD:-LedgerLab!2026}
      DEFAULT_TRUSTED_IPS: ${DEFAULT_TRUSTED_IPS:-203.0.113.0/24}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-test}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-new_device}
      RECAPTCHA_PROJECT_ID: ${RECAPTCHA_PROJECT_ID:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_API_KEY: ${RECAPTCHA_API_KEY:-}
      MFA_SMS_STEP: ${MFA_SMS_STEP:-true}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-15}
      BOT_DETECTION: ${BOT_DETECTION:-true}
      BOT_MAX_REQUESTS_PER_MIN: ${BOT_MAX_REQUESTS_PER_MIN:-60}
      BOT_MIN_ACTION_MS: ${BOT_MIN_ACTION_MS:-400}
      BOT_FLAG_FORCES_MFA: ${BOT_FLAG_FORCES_MFA:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - ledgerlab-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000" # direct API access (the app itself goes through the frontend)
    depends_on:
      - mailpit
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI: http://localhost:8025
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  ledgerlab-data:
